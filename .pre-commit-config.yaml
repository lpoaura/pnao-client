minimum_pre_commit_version: '4.0.0'
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: poetry-check
        name: Poetry lock check
        entry: poetry check --lock
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-check
        name: Ruff lint
        entry: poetry run ruff check .
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-format
        name: Ruff format check
        entry: poetry run ruff format --check .
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest
        name: Tests and coverage (100%)
        entry: poetry run pytest --cov=pnao_client --cov-branch --cov-report=term-missing --cov-fail-under=100
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
