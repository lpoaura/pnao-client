name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Match tag to package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PYTHON'
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          version = tomllib.loads(Path("pyproject.toml").read_text())["tool"]["poetry"]["version"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", tag):
              raise SystemExit("Expected a stable release tag: X.Y.Z")
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag} does not match package version {version}")
          PYTHON

  ci:
    needs: validate
    uses: ./.github/workflows/ci.yml

  docs:
    name: Validate release documentation
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Poetry
        run: pipx install poetry==2.3.2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: poetry
      - run: poetry install --only main,docs --no-interaction
      - run: poetry run sphinx-build -b html -W --keep-going docs/source docs/_build/html

  publish:
    name: Publish to PyPI
    needs: [ci, docs]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pnao-client/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Publish verified distributions
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Create release and attach distributions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes
          fi
