
[tool.poetry]
name = "pnao-client"
version = "0.2.0"
description = "Client PNAO for PostgreSQL"
readme = "README.md"
authors = ["lpofredc <frederic.cloitre@lpo.fr>"]
maintainers = ["lpofredc <frederic.cloitre@lpo.fr>"]
packages = [{ include = "pnao_client" }]

[tool.poetry.dependencies]
python = "^3.12"
requests = "^2.32"
sqlalchemy = "^2.0"
psycopg2-binary = "^2.9"
alembic = "^1.13"
python-dotenv = "^1.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<10"
pytest-cov = "^4.1"
ruff = "^0.16.9"

[tool.poetry.group.docs.dependencies]
sphinx = "^7.2"
myst-parser = "^2.0"
sphinx-rtd-theme = "^2.0"

[tool.poetry.scripts]
pnao = "pnao_client.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
